<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>

    <style>
        body{
            text-align: justify;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(128, 128, 128);
        }

        header{
            background-image: url('img/ASTRONAUT-AND-JELLYFISH-12302022.png');
            background-position: center center;
            padding: 50px;
            background-size: cover;
            background-repeat: no-repeat;
            min-width: 100%;
            color: white;
            border: 5px dashed white;

        }

        picture img{
            max-width: 400px;
            width: 100%;
            display: block;
        }

    </style>

</head>
<body>

    <header>
        <h1>Trabalhando com imagens</h1>



    </header>
    <!--
        Figure (figura) -> usada para definir uma foto, ilustração, diagrama e etc.
    -->


    <figure>
        <img src="https://ufsb.edu.br/residenciapedagogica/images/phocagallery/galeria2/thumbs/phoca_thumb_l_image03_grd.png" alt="Pinguins" width="300px" height="300px">
        <figcaption>Pintura de óleo de pinguim</figcaption>
    </figure>

    <section>
        <h1>Pilotos formula 1</h1>

        <picture>
            <figure>
                <img src="https://admin.cnnbrasil.com.br/wp-content/uploads/sites/12/2024/06/max_verstappen-e1718131290383.jpeg?w=1200&h=900&crop=1" alt="Max Verstappen">
                <figcaption>Max Verstappen</figcaption>
            </figure>
        </picture>

        <picture>
            <figure>
                <img src="https://start.youse.com.br/wp-content/uploads/2018/06/hamilton.jpg" alt="Hamilton">
                <figcaption>Hamilton</figcaption>
            </figure>
        </picture>

        <picture>
            <figure>
                <img src="https://img2.51gt3.com/rac/racer/202404/36bc3c4fc5a84dfa80319aac855f5c9f.jpg?x-oss-process=style/_nhd_en">
                <figcaption>Carlos Sainz</figcaption>
            </figure>
        </picture>


    </section>

    


    
</body>
</html>
